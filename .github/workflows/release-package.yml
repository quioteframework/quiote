name: Release package

# Tag-triggered: push a `packages/<name>/vX.Y.Z` tag (e.g.
# `packages/db-propulsion/v4.0.1`) to release that ONE package
# independently of the framework's own version. Since v4.0.0, package
# versions no longer move in lockstep with the framework's own tags.
#
# Runs the full test suite (the tag may point at a commit older than
# main's current tip, so this re-verifies at that exact SHA), generates a
# changelog scoped to just that package's commits, tags the package's
# already-synced split repo (quioteframework/<name>, kept current by
# split.yml's content-only push) with a plain vX.Y.Z, and publishes a
# GitHub Release there -- not on this monorepo.

on:
  push:
    tags:
      - 'packages/*/v*.*.*'

permissions:
  contents: read

jobs:
  release-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # git-cliff needs the full commit/tag history to scope the
          # changelog to "everything since the previous tag" for this
          # package.
          fetch-depth: 0

      - name: Parse package name and version from the tag
        id: package
        run: |
          # github.ref_name is "packages/<name>/v<version>".
          REF="${{ github.ref_name }}"
          NAME="${REF#packages/}"
          NAME="${NAME%/v*}"
          VERSION="${REF##*/}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify the package directory exists
        run: test -d "packages/${{ steps.package.outputs.name }}"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, intl, xsl, tokenizer, session, pdo, pdo_sqlite, iconv, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --no-coverage

      - name: Generate changelog
        # Scoped by an explicit `<this package's previous STABLE tag>..<this tag>`
        # range. `--current` cannot be used: it asks git which tag names the current
        # commit, and a release that tags several packages at once puts many tags
        # on one SHA, so git answers with whichever single tag it prefers. Every
        # package whose tag is not the chosen one then fails with "No tag exists
        # for the current commit" -- after the suite has already run. The range
        # depends only on the tag that triggered this run. release.yml derives
        # the framework's notes the same way, for the same reason.
        #
        # --exclude "packages/${PKG_NAME}/v*-RC*" makes "previous" always the
        # last STABLE release for this package, never an intermediate RC -- so
        # an RC's own notes are deliberately cumulative ("everything since
        # last GA," a preview of the whole upcoming release, not a diff
        # against the last RC, which degenerates to "promotes RC2 unchanged"
        # the moment two RCs in a row have no new commits between them), and
        # the eventual GA tag gets a clean stable-to-stable changelog with
        # none of the RC tags treated as version boundaries.
        env:
          PKG_NAME: ${{ steps.package.outputs.name }}
          TAG: ${{ github.ref_name }}
        run: |
          GIT_CLIFF_VERSION="2.13.1"
          curl -sSL -o /tmp/git-cliff.tar.gz \
            "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp
          # Empty on a package's first stable release, which has no
          # predecessor to measure from; git-cliff then covers that package's
          # whole history.
          PREVIOUS="$(git describe --tags --abbrev=0 --match "packages/${PKG_NAME}/v*" --exclude "packages/${PKG_NAME}/v*-RC*" "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREVIOUS" ]; then
            SCOPE="${PREVIOUS}..${TAG}"
            echo "Generating notes for ${SCOPE}"
          else
            SCOPE=""
            echo "No prior stable tag for ${PKG_NAME}; generating notes for its whole history"
          fi
          # --ignore-tags is required in addition to --exclude above: an
          # intermediate RC tag between $PREVIOUS and $TAG is still a real,
          # reachable tag, and git-cliff splits a range into one entry per
          # tag it finds inside it regardless of which one bounds the range
          # -- --exclude only steers PREVIOUS's own resolution, so without
          # this an RC1..RC2..GA history would still render as three
          # separate headings instead of one.
          # shellcheck disable=SC2086
          "/tmp/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" \
            --include-path "packages/${PKG_NAME}/**" \
            --tag-pattern "^packages/${PKG_NAME}/v" \
            --ignore-tags='-RC[0-9]+$' \
            $SCOPE \
            --tag "${TAG##*/}" \
            --strip header -o /tmp/release-notes.md
          # Scoping from the last STABLE tag makes this the genuine "nothing at
          # all changed since GA" case now, not "nothing changed since the last
          # RC" -- e.g. an RC promoted straight to GA on the same commit, or a
          # release cut for version-bump reasons alone. The range holds no
          # commits and git-cliff writes just its heading -- a release body
          # that is technically non-empty and still says nothing -- so this is
          # tested for entries rather than for bytes, and appended so the
          # heading survives.
          if ! grep -q '^- ' /tmp/release-notes.md; then
            if [ -n "$PREVIOUS" ]; then
              printf '\nNo changes recorded against this package since %s.\n' \
                "${PREVIOUS##*/}" >> /tmp/release-notes.md
            else
              printf '\nNo changes are recorded against this package for this release.\n' \
                >> /tmp/release-notes.md
            fi
          fi

      - name: Configure git to authenticate with SPLIT_TOKEN
        env:
          SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SPLIT_TOKEN}@github.com/".insteadOf "git@github.com:"

      - name: Tag the split repo and create its release
        env:
          GH_TOKEN: ${{ secrets.SPLIT_TOKEN }}
          PKG_NAME: ${{ steps.package.outputs.name }}
          PKG_VERSION: ${{ steps.package.outputs.version }}
        run: |
          TARGET="git@github.com:quioteframework/${PKG_NAME}.git"
          WORKDIR="$(mktemp -d)"
          git clone --depth 1 "$TARGET" "$WORKDIR"
          cd "$WORKDIR"
          git tag "$PKG_VERSION"
          git push origin "$PKG_VERSION"
          PRERELEASE_FLAG=""
          case "$PKG_VERSION" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          gh release create "$PKG_VERSION" \
            --repo "quioteframework/${PKG_NAME}" \
            --notes-file /tmp/release-notes.md \
            $PRERELEASE_FLAG
