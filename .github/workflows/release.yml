name: Release

# Tag-triggered: push a `v*.*.*` tag (e.g. `v1.2.0`) to run the full test
# suite, generate a changelog with git-cliff scoped to just the commits
# belonging to that tag, and publish a GitHub Release with that changelog as
# its body. The release step only runs if the test suite passes, so a broken
# build never gets released.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # git-cliff needs the full commit/tag history to scope the
          # changelog to "everything since the previous tag" -- the default
          # shallow checkout only has the tagged commit itself.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, intl, xsl, tokenizer, session, pdo, pdo_sqlite, iconv, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --no-coverage

      - name: Generate changelog
        # Downloaded standalone rather than via a third-party composite
        # action: full control over the exact invocation instead of trusting
        # an action's env-var/output contract.
        #
        # Scoped by an explicit `<previous tag>..<this tag>` range so the notes
        # cover only this release's commits, rather than the whole project
        # history that a bare `--tag` would include.
        #
        # The range is spelled out instead of using `--current` because a
        # framework tag and the `packages/<name>/vX.Y.Z` tags frequently land on
        # the *same* commit -- a release that ships the framework and its
        # packages together puts a dozen tags on one SHA. Git resolves that
        # commit to a single tag (`git describe --exact-match` picks one of the
        # package tags), so `--current` reports "No tag exists for the current
        # commit" and the release fails. The range depends on nothing but the
        # tag that triggered the run.
        #
        # --tag-pattern restricts git-cliff to plain framework tags -- since
        # v4.0.0, individual packages mint their own `packages/<name>/vX.Y.Z`
        # tags (see release-package.yml), which must never be treated as a
        # framework version boundary here. The same pattern, as a glob, picks
        # the previous framework tag: `git describe` walks ancestors from the
        # tag's parent, so it finds the last framework release rather than
        # whatever sorts highest.
        #
        # --exclude '*-RC*' makes that "previous" tag always the last STABLE
        # release, never an intermediate RC -- so these notes always cover
        # everything since the last GA, whether TAG itself is another RC (a
        # deliberately cumulative "here's everything so far" preview, not a
        # diff against the last RC, which degenerates to "promotes RC2
        # unchanged" the moment two RCs in a row have no new commits between
        # them) or the eventual GA tag (a clean stable-to-stable changelog,
        # with none of the RC tags' own commits double-counted or given their
        # own headings -- they were never real version boundaries). Nothing
        # about the framework's own conventions uses any prerelease suffix
        # other than "-RC<n>", so this pattern is exact.
        #
        # Skipped for v1.0.0: the commit history before that tag predates
        # this repo's conventional-commit convention, so git-cliff has
        # nothing usable to scope against. v1.0.0 ships hand-written release
        # notes instead; every tag after it is generated normally.
        if: github.ref_name != 'v1.2.0'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          GIT_CLIFF_VERSION="2.13.1"
          curl -sSL -o /tmp/git-cliff.tar.gz \
            "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp
          # Empty for the earliest stable framework tag, which has no
          # predecessor to measure from; git-cliff then falls back to the
          # newest tag it can see, which at that point is the one being
          # released.
          PREVIOUS="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-RC*' "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREVIOUS" ]; then
            SCOPE="${PREVIOUS}..${TAG}"
            echo "Generating notes for ${SCOPE}"
          else
            SCOPE="--latest"
            echo "No framework tag precedes ${TAG}; generating notes for the latest tag"
          fi
          # --ignore-tags is required in addition to --exclude above: an
          # intermediate RC tag between $PREVIOUS and $TAG is still a real,
          # reachable tag, and git-cliff splits a range into one entry per
          # tag it finds inside it regardless of which one bounds the range
          # -- --exclude only steers PREVIOUS's own resolution, so without
          # this an RC1..RC2..GA history would still render as three
          # separate headings instead of one.
          #
          # --exclude-path keeps a commit scoped entirely to one or more
          # packages/ out of the framework's own release notes -- each
          # package publishes its own release separately (release-package.yml).
          # A commit that also touches a root file is kept either way.
          # shellcheck disable=SC2086
          "/tmp/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" \
            --tag-pattern '^v[0-9]' \
            --ignore-tags='-RC[0-9]+$' \
            --exclude-path 'packages/**' \
            $SCOPE \
            --tag "${TAG}" \
            --strip header \
            -o /tmp/release-notes.md

      - name: Use hand-written notes for v1.2.0
        if: github.ref_name == 'v1.0.0'
        run: cp .github/release-notes/v1.2.0.md /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: /tmp/release-notes.md
          # A tag with a hyphen in it is a pre-release -- v4.0.0-RC1, and any
          # beta or alpha after it. Without this the action publishes it as
          # the latest release, so `composer require quioteframework/quiote`
          # on a default stability would be pointed at a release candidate.
          prerelease: ${{ contains(github.ref_name, '-') }}
