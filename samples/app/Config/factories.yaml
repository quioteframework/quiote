# Factories in YAML. Settings are in
# php, this is YAML, databases/output_types are XML: one
# generated app, all three FormatDrivers.
controller:
  class: Quiote\Controller\Controller
  params: []
response:
  class: Quiote\Response\WebResponse
  params: []
database_manager:
  class: Quiote\Database\DatabaseManager
  params: []
routing:
  class: SampleApp\Routing\AppRouting
  params: []
request:
  class: Quiote\Request\WebRequest
  params: []
user:
  class: Quiote\User\User
  params: []
validation_manager:
  class: Quiote\Validator\ValidationManager
  params: []

# File-backed sessions: no database required. Swap the class for a PDO, Redis
# or object-storage factory to share sessions across hosts.
session:
  class: Quiote\Session\FileSessionFactory
  params:
    dir: '%core.app_dir%/cache/sessions'
